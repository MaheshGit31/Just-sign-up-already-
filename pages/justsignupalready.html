<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ok fine, sign up</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="./signup.css">
</head>
<body>
    <main class="stage">
        <section class="card" id="card" aria-live="polite"></section>
    </main>

    <script>
        const ballMessages = [
            "nope. not that name.",
            "bro. no.",
            "we literally just said no",
            "you're not getting in as ball. ever.",
            "go touch grass and come back with a real name"
        ];

        const sureRounds = [
            ['are you sure?', 'this is your last chance to back out'],
            ['are you really sure?', 'think about it'],
            ['like really really sure?', "we'll wait"],
            ['last chance. sure?', 'we mean it this time'],
            ['ok but are you REALLY sure?', 'okay fine. final one. promise']
        ];

        const alphabetBackwards = 'zyxwvutsrqponmlkjihgfedcba';

        const vibeLabels = ['vibes', 'sort of vibes', 'a bus', 'vibes?', 'traffic light', 'not vibes', 'a hill', 'mid', 'aura'];

        const termsFiller = [
            'the user agrees to be mildly inconvenienced at all times.',
            'we may or may not read what you type.',
            'any resemblance to a good sign up page is a coincidence.',
            'the user waives their right to a normal experience.',
            'cookies are not included. sorry.',
            'we reserve the right to ask one more question.',
            'time spent here will not be refunded.',
            'by scrolling you accept everything below, and above.'
        ];

        const termsTarget = 'the user admits that ball is a perfectly good name.';

        const card = document.getElementById('card');
        let answers = {};
        let current = 0;
        let ballTries = 0;
        let colorTries = 0;
        let sureRound = 0;
        let captchaTries = 0;
        let holdSeconds = 30;
        let busy = false;

        const esc = (s) => s.replace(/[&<>"']/g, (ch) => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[ch]));

        const isBall = (v) => v.toLowerCase().replace(/[^a-z]/g, '') === 'ball';

        const count = (i) => `<p class="count">card ${i + 1} of way too many</p>`;

        const cards = [
            {
                kind: 'text',
                id: 'name',
                q: "what's your name?",
                hint: "first name is fine. we're not the government",
                placeholder: 'name...',
                check(v) {
                    if (!v) return 'type something bro';
                    return null;
                }
            },
            {
                kind: 'text',
                id: 'email',
                q: "what's your email?",
                hint: 'we promise to only email you 400 times a day',
                placeholder: 'you@something.com',
                check(v) {
                    if (!v) return 'type something bro';
                    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) return "that doesn't look like an email";
                    return null;
                }
            },
            {
                kind: 'text',
                id: 'username',
                q: 'pick a username',
                hint: 'make it good. or whatever',
                placeholder: 'username...',
                check(v) {
                    if (!v) return 'type something bro';
                    if (v.length < 3) return 'at least 3 characters';
                    if (/\s/.test(v)) return 'no spaces';
                    return null;
                }
            },
            {
                kind: 'text',
                id: 'password',
                inputType: 'password',
                q: 'now a password',
                hint: 'at least 8 characters. nothing crazy',
                placeholder: 'password...',
                check(v) {
                    if (v.length < 8) return 'at least 8 characters';
                    return null;
                }
            },
            {
                kind: 'text',
                id: 'emailConfirm',
                q: 'confirm your email',
                hint: "TYPE IT IN ALL CAPS. we're hard of hearing",
                placeholder: 'YOU@SOMETHING.COM',
                check(v) {
                    if (!v) return 'type something bro';
                    if (v.toLowerCase() !== answers.email.toLowerCase()) return "that's not the email you gave us";
                    if (v !== v.toUpperCase()) return 'LOUDER. we can barely hear you';
                    return null;
                }
            },
            {
                kind: 'text',
                id: 'password',
                inputType: 'password',
                q: (a) => `ok ${a.name}, that password won't cut it`,
                hint: 'we need a stronger one. trust us',
                placeholder: 'new password...',
                check(v) {
                    if (v === answers.password) return "can't be your old password";
                    if (v.length < 8) return 'at least 8 characters';
                    if (!/[A-Z]/.test(v)) return 'needs a capital letter';
                    if (!/\d/.test(v)) return 'needs a number';
                    if (!/[^A-Za-z0-9]/.test(v)) return 'needs a symbol';
                    if (!/[aiou]/i.test(v)) return "needs a vowel that isn't e";
                    return null;
                }
            },
            {
                kind: 'text',
                id: 'color',
                q: "what's your favorite color?",
                hint: 'just curious',
                placeholder: 'color...',
                check(v) {
                    if (!v) return 'type something bro';
                    if (colorTries === 0) {
                        colorTries++;
                        return 'too popular. pick another one';
                    }
                    return null;
                }
            },
            {
                kind: 'text',
                id: 'human',
                q: "prove you're human",
                hint: 'type the alphabet backwards. all 26. no mistakes',
                placeholder: 'zyx...',
                check(v) {
                    const typed = v.toLowerCase().replace(/\s/g, '');
                    if (!typed) return 'type something bro';
                    if (typed === alphabetBackwards) return null;
                    let i = 0;
                    while (i < typed.length && typed[i] === alphabetBackwards[i]) i++;
                    if (i === typed.length) return `keep going. that's only ${typed.length} letters`;
                    return `nope. you messed up at letter ${i + 1}`;
                }
            },
            {
                kind: 'slider',
                id: 'trust',
                q: 'how much do you trust us?',
                hint: 'move it to exactly 73. no numbers, no peeking',
                check(v) {
                    if (v === 73) return null;
                    if (Math.abs(v - 73) <= 3) return 'so close';
                    return v > 73 ? 'too high' : 'too low';
                }
            },
            {
                kind: 'year',
                id: 'birthYear',
                q: 'when were you born?',
                hint: 'click through the years. we start at 1900. we like to be thorough',
                check(v) {
                    if (v === 1900) return "you're not 126 years old";
                    return null;
                }
            },
            {
                kind: 'sure'
            },
            {
                kind: 'hold',
                id: 'serious',
                q: 'ok but are you serious?',
                hint: 'hold the button for 30 seconds. let go and it starts over'
            },
            {
                kind: 'captcha',
                id: 'vibes',
                q: 'select all squares containing vibes',
                hint: "we'll know if you got it wrong"
            },
            {
                kind: 'terms',
                id: 'terms',
                q: 'terms and conditions',
                hint: 'scroll to the bottom. read every word. we will know'
            },
            {
                kind: 'end'
            }
        ];

        function renderCard(i, note) {
            const c = cards[i];
            if (c.kind === 'end') return renderEnd();
            if (c.kind === 'hold') return renderHold(i);
            if (c.kind === 'captcha') return renderCaptcha(i, note);
            if (c.kind === 'terms') return renderTerms(i);
            if (c.kind === 'slider') return renderSlider(i);
            if (c.kind === 'year') return renderYear(i);
            if (c.kind === 'sure') return renderSure(i);
            return renderText(i, note);
        }

        function renderEnd() {
            try { sessionStorage.setItem('jsuaName', answers.name || ''); } catch (e) {}
            location.href = './ending.html';
        }

        function renderText(i, note) {
            const c = cards[i];
            const q = esc(typeof c.q === 'function' ? c.q(answers) : c.q);

            card.innerHTML = `
                ${count(i)}
                <form id="form" autocomplete="off">
                    <h2>${q}</h2>
                    <p class="hint">${c.hint}</p>
                    <input id="field" type="${c.inputType || 'text'}" placeholder="${c.placeholder}" maxlength="60" spellcheck="false" autocomplete="off">
                    <p class="msg" id="msg"></p>
                    <button type="submit">next</button>
                </form>`;

            const form = document.getElementById('form');
            const field = document.getElementById('field');
            const msg = document.getElementById('msg');

            if (note) msg.textContent = note;
            field.focus();
            field.addEventListener('input', () => { msg.textContent = ''; });

            form.addEventListener('submit', (e) => {
                e.preventDefault();
                if (busy) return;
                const value = field.value.trim();

                if (isBall(value)) {
                    ballTries++;
                    shake();
                    if (current === 0) {
                        msg.textContent = ballMessages[Math.min(ballTries - 1, ballMessages.length - 1)];
                        field.select();
                    } else {
                        msg.textContent = 'ball?? we said no. back to the start.';
                        busy = true;
                        setTimeout(restart, 1200);
                    }
                    return;
                }

                const error = c.check(value);
                if (error) {
                    msg.textContent = error;
                    shake();
                    field.select();
                    return;
                }
                answers[c.id] = value;
                go(current + 1);
            });
        }

        function renderSlider(i) {
            const c = cards[i];
            const start = Math.floor(Math.random() * 40);

            card.innerHTML = `
                ${count(i)}
                <form id="form">
                    <h2>${esc(c.q)}</h2>
                    <p class="hint">${c.hint}</p>
                    <input id="field" type="range" min="0" max="100" step="1" value="${start}">
                    <p class="msg" id="msg"></p>
                    <button type="submit">next</button>
                </form>`;

            const form = document.getElementById('form');
            const field = document.getElementById('field');
            const msg = document.getElementById('msg');

            field.focus();
            field.addEventListener('input', () => { msg.textContent = ''; });

            form.addEventListener('submit', (e) => {
                e.preventDefault();
                if (busy) return;
                const error = c.check(Number(field.value));
                if (error) {
                    msg.textContent = error;
                    shake();
                    return;
                }
                answers[c.id] = Number(field.value);
                go(current + 1);
            });
        }

        function renderYear(i) {
            const c = cards[i];
            const max = new Date().getFullYear();
            let year = 1900;

            card.innerHTML = `
                ${count(i)}
                <form id="form">
                    <h2>${esc(c.q)}</h2>
                    <p class="hint">${c.hint}</p>
                    <p class="year" id="year">${year}</p>
                    <p class="msg" id="msg"></p>
                    <div class="row">
                        <button type="button" id="plus">+1 year</button>
                        <button type="submit">that's me</button>
                    </div>
                </form>`;

            const form = document.getElementById('form');
            const plus = document.getElementById('plus');
            const yearEl = document.getElementById('year');
            const msg = document.getElementById('msg');

            plus.focus();
            plus.addEventListener('click', () => {
                if (year >= max) {
                    msg.textContent = "that's the future. you can't go further";
                    return;
                }
                year++;
                yearEl.textContent = year;
                msg.textContent = '';
            });

            form.addEventListener('submit', (e) => {
                e.preventDefault();
                if (busy) return;
                const error = c.check(year);
                if (error) {
                    msg.textContent = error;
                    shake();
                    return;
                }
                answers[c.id] = year;
                go(current + 1);
            });
        }

        function renderSure(i) {
            const [qText, hintText] = sureRounds[sureRound];
            const yesFirst = Math.random() < 0.5;
            const yes = '<button type="button" id="yes">yes</button>';
            const no = '<button type="button" id="no">no</button>';

            card.innerHTML = `
                ${count(i)}
                <h2>${esc(qText)}</h2>
                <p class="hint">${esc(hintText)}</p>
                <p class="msg" id="msg"></p>
                <div class="row">${yesFirst ? yes + no : no + yes}</div>`;

            document.getElementById('yes').addEventListener('click', () => {
                if (busy) return;
                sureRound++;
                if (sureRound >= sureRounds.length) {
                    answers.sure = true;
                    go(current + 1);
                } else {
                    shake();
                    renderSure(i);
                }
            });

            document.getElementById('no').addEventListener('click', () => {
                if (busy) return;
                document.getElementById('msg').textContent = 'that was a no. try again';
                shake();
            });
        }

        function ballReset(msg) {
            ballTries++;
            shake();
            msg.textContent = 'ball?? we said no. back to the start.';
            busy = true;
            setTimeout(restart, 1200);
        }

        function renderHold(i) {
            const c = cards[i];

            card.innerHTML = `
                ${count(i)}
                <h2>${esc(c.q)}</h2>
                <p class="hint">${c.hint}</p>
                <button type="button" class="hold" id="hold"><span class="fill" id="fill"></span><span class="label" id="label">hold me</span></button>
                <p class="msg" id="msg"></p>`;

            const hold = document.getElementById('hold');
            const fill = document.getElementById('fill');
            const label = document.getElementById('label');
            const msg = document.getElementById('msg');
            let startedAt = 0;
            let frame = 0;
            let holding = false;

            const tick = () => {
                const elapsed = (performance.now() - startedAt) / 1000;
                const pct = Math.min(elapsed / holdSeconds, 1);
                fill.style.width = (pct * 100) + '%';
                label.textContent = Math.max(Math.ceil(holdSeconds - elapsed), 0) + 's left';
                if (pct >= 1) {
                    holding = false;
                    answers[c.id] = true;
                    go(current + 1);
                    return;
                }
                frame = requestAnimationFrame(tick);
            };

            const start = () => {
                if (busy || holding) return;
                holding = true;
                msg.textContent = '';
                startedAt = performance.now();
                frame = requestAnimationFrame(tick);
            };

            const stop = () => {
                if (!holding) return;
                holding = false;
                cancelAnimationFrame(frame);
                fill.style.width = '0';
                label.textContent = 'hold me';
                msg.textContent = 'you let go. start over';
                shake();
            };

            hold.addEventListener('pointerdown', (e) => { e.preventDefault(); start(); });
            hold.addEventListener('pointerup', stop);
            hold.addEventListener('pointerleave', stop);
            hold.addEventListener('pointercancel', stop);
            hold.addEventListener('contextmenu', (e) => e.preventDefault());
            hold.addEventListener('blur', stop);
            hold.addEventListener('keydown', (e) => {
                if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); start(); }
            });
            hold.addEventListener('keyup', (e) => {
                if (e.key === ' ' || e.key === 'Enter') stop();
            });
        }

        function renderCaptcha(i, note) {
            const c = cards[i];
            const labels = vibeLabels.slice();
            for (let n = labels.length - 1; n > 0; n--) {
                const k = Math.floor(Math.random() * (n + 1));
                [labels[n], labels[k]] = [labels[k], labels[n]];
            }

            card.innerHTML = `
                ${count(i)}
                <form id="form">
                    <h2>${esc(c.q)}</h2>
                    <p class="hint">${c.hint}</p>
                    <div class="grid">${labels.map((l) => `<button type="button" class="tile">${esc(l)}</button>`).join('')}</div>
                    <p class="msg" id="msg"></p>
                    <button type="submit">verify</button>
                </form>`;

            const form = document.getElementById('form');
            const msg = document.getElementById('msg');
            if (note) msg.textContent = note;

            form.querySelectorAll('.tile').forEach((tile) => {
                tile.addEventListener('click', () => {
                    tile.classList.toggle('on');
                    msg.textContent = '';
                });
            });

            form.addEventListener('submit', (e) => {
                e.preventDefault();
                if (busy) return;
                if (!form.querySelector('.tile.on')) {
                    msg.textContent = 'select something bro';
                    shake();
                    return;
                }
                captchaTries++;
                if (captchaTries < 3) {
                    shake();
                    renderCaptcha(i, 'wrong vibes. try again');
                    return;
                }
                answers[c.id] = true;
                go(current + 1);
            });
        }

        function renderTerms(i) {
            const c = cards[i];
            let sections = '';
            for (let n = 1; n <= 40; n++) {
                const a = termsFiller[(n * 3) % termsFiller.length];
                const b = termsFiller[(n * 5 + 1) % termsFiller.length];
                sections += `<h4>section ${n}</h4><p>${a} ${b}</p>`;
                if (n === 20) sections += `<p>${termsTarget}</p>`;
            }

            card.innerHTML = `
                ${count(i)}
                <form id="form" autocomplete="off">
                    <h2>${esc(c.q)}</h2>
                    <p class="hint">${c.hint}</p>
                    <div class="terms" id="terms">${sections}</div>
                    <input id="field" type="text" placeholder="scroll to the bottom first..." maxlength="120" spellcheck="false" autocomplete="off" disabled>
                    <p class="msg" id="msg"></p>
                    <button type="submit" id="next" disabled>agree</button>
                </form>`;

            const form = document.getElementById('form');
            const box = document.getElementById('terms');
            const field = document.getElementById('field');
            const msg = document.getElementById('msg');
            const next = document.getElementById('next');
            const norm = (v) => v.toLowerCase().replace(/[^a-z0-9]/g, '');

            box.addEventListener('scroll', () => {
                if (!field.disabled) return;
                if (box.scrollTop + box.clientHeight >= box.scrollHeight - 4) {
                    field.disabled = false;
                    next.disabled = false;
                    field.placeholder = 'retype the sentence from section 20...';
                    msg.textContent = 'ok. now retype the sentence from section 20';
                }
            });

            field.addEventListener('input', () => { msg.textContent = ''; });

            form.addEventListener('submit', (e) => {
                e.preventDefault();
                if (busy || field.disabled) return;
                const value = field.value.trim();
                if (isBall(value)) {
                    ballReset(msg);
                    return;
                }
                if (norm(value) !== norm(termsTarget)) {
                    msg.textContent = "that's not what it says. did you even read it?";
                    shake();
                    return;
                }
                answers[c.id] = true;
                go(current + 1);
            });
        }

        function shake() {
            card.classList.remove('shake');
            void card.offsetWidth;
            card.classList.add('shake');
        }

        function go(to, note) {
            busy = true;
            card.classList.add('leaving');
            setTimeout(() => {
                current = to;
                renderCard(current, note);
                card.classList.remove('leaving');
                card.classList.add('entering');
                busy = false;
                setTimeout(() => card.classList.remove('entering'), 400);
            }, 350);
        }

        function restart() {
            answers = {};
            colorTries = 0;
            sureRound = 0;
            captchaTries = 0;
            go(0, 'told you. ball is not a name.');
        }

        renderCard(current);
    </script>
</body>
</html>
